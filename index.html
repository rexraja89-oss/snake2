<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Snake Game</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        canvas { background: #000; }
        #score { color: #fff; font-size: 24px; margin-bottom: 10px; }
        #restart { padding: 10px 20px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="restart" style="display:none;">Restart</button>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const box = 20;
        let score = 0;
        let snake = [{ x: 10 * box, y: 10 * box }];
        let food = { x: Math.floor(Math.random() * 20) * box, y: Math.floor(Math.random() * 20) * box };
        let d;

        document.addEventListener("keydown", direction);
        document.getElementById("restart").onclick = restartGame;

        function direction(event) {
            if(event.keyCode === 37 && d !== "RIGHT") d = "LEFT";
            else if(event.keyCode === 38 && d !== "DOWN") d = "UP";
            else if(event.keyCode === 39 && d !== "LEFT") d = "RIGHT";
            else if(event.keyCode === 40 && d !== "UP") d = "DOWN";
        }

        function gameLoop() {
            if(snake[0].x === food.x && snake[0].y === food.y) {
                score++;
                food = { x: Math.floor(Math.random() * 20) * box, y: Math.floor(Math.random() * 20) * box };
            } else {
                snake.pop();
            }

            const head = { x: snake[0].x, y: snake[0].y };
            if(d === "LEFT") head.x -= box;
            if(d === "UP") head.y -= box;
            if(d === "RIGHT") head.x += box;
            if(d === "DOWN") head.y += box;

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || collision(head, snake)) {
                clearInterval(game);
                document.getElementById("restart").style.display = "block";
                return;
            }

            snake.unshift(head);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);
            ctx.fillStyle = "green";
            snake.forEach(s => ctx.fillRect(s.x, s.y, box, box));
            document.getElementById("score").innerText = "Score: " + score;
        }

        function collision(head, array) {
            for(let i = 1; i < array.length; i++) {
                if(head.x === array[i].x && head.y === array[i].y) return true;
            }
            return false;
        }

        function restartGame() {
            score = 0;
            snake = [{ x: 10 * box, y: 10 * box }];
            food = { x: Math.floor(Math.random() * 20) * box, y: Math.floor(Math.random() * 20) * box };
            d = null;
            document.getElementById("restart").style.display = "none";
            game = setInterval(gameLoop, 100);
        }

        let game = setInterval(gameLoop, 100);
    </script>
</body>
</html>
